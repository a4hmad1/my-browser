name: Build CineStream releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: build:linux
            arch: x64
          - os: ubuntu-latest
            build: build:linux
            arch: arm64
          - os: windows-latest
            build: build:win
            arch: x64
          - os: windows-latest
            build: build:win
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set production account server
        run: npm run configure:desktop
        env:
          CINEMA_API_URL: ${{ vars.CINEMA_API_URL }}
      - name: Build native installers
        run: npm run ${{ matrix.build }} -- --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: CineStream-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
